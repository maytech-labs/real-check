[package]
name = "real-check"
version = "0.1.0"
edition = "2024"
description = "Checks a repository and its dependencies for compatibility with the Reciprocal Ethical AI License (REAL)"
license-file = "LICENSE.md"
repository = "https://github.com/maytech-labs/real-check"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
